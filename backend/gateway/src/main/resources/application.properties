spring.application.name=gateway
server.port=8086

logging.level.org.springframework.cloud.gateway.server.mvc=TRACE
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.org.springframework.cloud.client.loadbalancer=DEBUG
logging.level.org.springframework.web.client=DEBUG

# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=candidature
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8085
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/mic3/candidature/**

spring.cloud.gateway.server.webmvc.routes[1].id=candidates
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://CANDIDAT
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/mic1/candidates/**


spring.cloud.gateway.server.webmvc.routes[2].id=job
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/jobs/**